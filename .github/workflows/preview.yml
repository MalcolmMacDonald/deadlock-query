name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # Fork PRs have no access to secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare secrets not set; skipping preview (see docs/dev-site.md)"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun tools/build.ts --target dev
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun tools/fetch-data.ts dist
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          bunx wrangler@4 pages deploy dist --project-name deadlock-query-dev --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "Preview: https://pr-${{ github.event.pull_request.number }}.deadlock-query-dev.pages.dev (deployment: $URL)" >> "$GITHUB_STEP_SUMMARY"
