<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Query builder</title>
<link rel="stylesheet" href="main.css">
<style>
html,body{height:100%;margin:0;background:#1e1e1e;color:#ddd;font:13px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #333}
#editor{height:40%;min-height:160px}
#results{flex:1;overflow:auto;padding:8px}
table{border-collapse:collapse}th,td{border:1px solid #333;padding:2px 8px;text-align:left}th{background:#252526}
.warning{background:#5a4a1a;padding:2px 6px;margin:4px 0}
</style></head>
<body>
<header><button id="run" type="button">Run (Ctrl+Enter)</button><span id="status">idle</span></header>
<div id="editor"></div><div id="results"></div>
<script type="module" src="main.js"></script></body></html>
