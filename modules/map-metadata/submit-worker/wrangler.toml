# Metadata submission endpoint (map-metadata M4). Local: `bunx wrangler dev` here. Deploying needs Malcolm's account.
name = "deadlock-query-submit"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "MalcolmMacDonald/deadlock-query"
BASE_BRANCH = "main"
PER_IP_PER_HOUR = "5"
GLOBAL_PER_DAY = "200"
# ALLOWED_ORIGIN = "https://malcolmmacdonald.github.io"   # set to the site origin(s) that call /submit

# Create once: `bunx wrangler kv namespace create RATE`, then paste the id.
# [[kv_namespaces]]
# binding = "RATE"
# id = "<kv-namespace-id>"

# Secrets (never in this file): `bunx wrangler secret put TURNSTILE_SECRET` and `... GITHUB_TOKEN`
# GITHUB_TOKEN: fine-grained token limited to this repo with Contents + Pull requests write; it cannot push to main
# when the ruleset requires PRs.
