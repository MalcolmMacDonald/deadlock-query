name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:deps
      - run: bun run verify:all
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          INFRA=""; if echo "$PR_LABELS" | grep -q '"infra"' || echo "$PR_TITLE" | grep -qi '^\[infra\]'; then INFRA="--infra"; fi
          bun run check:scope -- --base "origin/$BASE_REF" --branch "$HEAD_REF" $INFRA
          bun run check:state -- --base "origin/$BASE_REF"
